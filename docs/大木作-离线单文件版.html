,quote:'"一曰華栱，足材栱也。兩卷頭者，其長七十二分。每頭以四瓣卷殺，每瓣長四分。與泥道栱相交，安於櫨枓口內。"',hook:"屋檐能伸多远，全看华栱叠几层。"},nidao:{name:"泥道栱",dims:"单材高 15 分，长 63 分，每头四瓣卷杀、每瓣长 4 分",role:"与华栱十字相交、平行于墙面的横栱，位于栌斗之上第一层，因常刷土朱如泥道得名。",origin:'泥道栱与华栱的十字相交是斗栱的基本构成法则——纵横咬合、互为支撑。「泥道」之名源于早期栱身常抹饰泥土而后施彩绘，这个名字保留了中国木构从"版筑泥墙"时代走来的历史记忆。',source:'《营造法式》卷四·大木作制度一"造栱之制"',quote:'"二曰泥道栱，其長六十三分，每頭以四瓣卷殺，每瓣長四分。與華栱出跳相列。"',hook:'华栱管"挑"，泥道栱管"连"——十字相交才成朵。'},guazi:{name:"瓜子栱",dims:"单材高 15 分，长 62 分，每头四瓣卷杀、每瓣长 4 分",role:'施于跳头之上的短横栱，上承慢栱——多跳铺作中层的"接力横梁"。',origin:"瓜子栱是短横栱中最常见的一种，因其身短圆如瓜子而得名。它在铺作层中承担着将上层重量分配到华栱跳头的关键任务，是单栱造与重栱造的分界标志——出现瓜子栱即意味着至少是五铺作以上。",source:'《营造法式》卷四·大木作制度一"造栱之制"',quote:'"三曰瓜子栱，施之於跳頭。其長六十二分，每頭以四瓣卷殺，每瓣長四分。"',hook:"名字最好记的一层栱：短而圆，如瓜子。"},man:{name:"慢栱",dims:"单材高 15 分，长 92 分，每头四瓣卷杀、每瓣长 3 分",role:"施于泥道栱、瓜子栱之上的长横栱——重栱造标志构件，让横向联系加倍绵密。",origin:"慢栱是铺作中长度最大的横栱，「慢」取缓慢延展之意。它叠于泥道栱或瓜子栱之上，使重栱造的横向传力路径比单栱造加倍绵密——这是宋人对结构精细化的重要贡献，也是区分铺作等级的标志构件。",source:'《营造法式》卷四·大木作制度一"造栱之制"',quote:'"五曰慢栱，施之於泥道、瓜子栱之上。其長九十二分，每頭以四瓣卷殺，每瓣長三分。"',hook:'铺作里最长的栱——"慢"在从容跨得更远。'},linggong:{name:"令栱",dims:"单材高 15 分，长 72 分，每头五瓣卷杀、每瓣长 4 分",role:"施于里外跳头之上、与耍头相交，直接承托替木与橑檐槫——屋檐重量最终压在它身上。",origin:"令栱是铺作最外层的横栱，「令」有号令边界之意——它标志着铺作悬挑系统的尽头。五瓣卷杀是它的身份特征，比其他横栱多出一瓣，使端头曲线更加优美。檐荷从椽传入槫，再由令栱传递给昂或华栱，最终回到柱身。",source:'《营造法式》卷四·大木作制度一"造栱之制"',quote:'"四曰令栱，施之於裏外跳頭之上，與耍頭相交。其長七十二分，每頭以五瓣卷殺，每瓣長四分。"',hook:"离屋檐最近的栱，五瓣卷杀是它的名片。"},shuatou:{name:"耍头",alias:"蚂蚱头",dims:"足材高 21 分，厚 10 分，出头长自跳心约 24 分",role:'铺作最上层顺跳方向出头的构件，头部做成蚂蚱头式折面——不承重，却是整朵铺作的"收笔"。',origin:"耍头之名生动形象——它像蚂蚱的头部一样从铺作中探出。在昂制铺作中，耍头常与昂尾位置对应，形成檐口的节奏感。这一构件纯粹为了造型而存在，是中国建筑「形式即结构、装饰即力学」的绝佳注脚。",source:"《营造法式》卷四·大木作制度一（爵头/耍头之制）",hook:'昂体系铺作里，它常是昂的"替身"。'},jiaohidou:{name:"交互斗",dims:"长 18 分 × 广 16 分 × 高 10 分",role:"施于华栱（昂）头上，十字开口，顺跳头承接令栱等横栱，并把上层华栱稳稳架起。",origin:'交互斗是斗家族中功能最"忙碌"的一种——它的十字开口同时承托两个方向的构件，是斗栱层间传力的十字路口。宋《营造法式》将其尺寸精确规定为 18×16×10 分。',source:'《营造法式》卷四·大木作制度一"造枓之制"',hook:"华栱挑出的尽头，由它接过下一层。"},sandou:{name:"散斗",dims:"长 16 分 × 广 14 分 × 高 10 分",role:'施于横栱两头的小斗，逐层传力——"散"言其多而分布。',origin:"散斗是铺作中数量最多的小斗。它体量虽小，却承载着将集中力分散传递的关键功能。散斗的分布密度直接影响铺作的承载能力——一朵八铺作中的散斗可达十数只。",source:'《营造法式》卷四·大木作制度一"造枓之制"',hook:"铺作里数量最多的小斗，无名却无处不在。"},qixindou:{name:"齐心斗",dims:"长 16 分 × 广 16 分 × 高 10 分",role:'施于栱心之上，居"心"而得名，上承上层华栱或枋、槫。',origin:"齐心斗与散斗的区别仅在于位置——它居栱正中心，恰好压在铺作的中轴线上。这个位置的斗受力最集中，故名「齐心」。",source:'《营造法式》卷四·大木作制度一"造枓之制"',hook:"一朵铺作的中轴线上，常常正是它。"},zhutoufang:{name:"柱头枋",dims:"广 15 分 × 厚 10 分，随间广",role:"铺作上方平行于墙面的长枋，联系各朵铺作，并承托上层构件。",origin:"柱头枋是铺作上方的水平连系构件，因施于柱头之上而得名。它将分散的斗栱串联成整体，使各朵铺作协同工作——这是中国建筑从单体构件走向系统化设计的关键一步。",source:"《营造法式》卷五·大木作制度二",hook:'把一排斗栱串成整体的"横梁"。'},puaipai:{name:"普拍枋",alias:"平板枋",dims:"广随材，置于柱头与阑额之上",role:'承托铺作层的横向联系枋，是斗栱的"地基"。宋称普拍枋，清称平板枋。',origin:'普拍枋是唐宋以来柱头与阑额之间新增的水平构件，使斗栱的坐面更加宽稳。它的出现标志着中国木构从"柱头直接承栱"向"普拍枋过渡"的演变——这一变化影响了此后所有木构建筑的面貌。',source:"《营造法式》卷五·大木作制度二",hook:"斗栱不是浮在空中的——它坐在普拍枋上。"},liaoyan:{name:"橑檐槫",alias:"撩檐槫、橑风槫",dims:"径约 21 分，随间广",role:"承托檐椽的最外一根圆形檩（槫），屋面重量经由椽——槫——令栱——华栱传回柱身。",origin:"「槫」是宋代对檩条的专称。橑檐槫是屋面最外端的檩，承托着全部檐椽——它是屋檐与斗栱的交接点，也是整朵铺作悬挑的最终服务对象。",source:"《营造法式》卷五·大木作制度二",hook:"整片屋檐的重量，最终走到这里。"},xiaang:{name:"下昂",dims:"足材高 21 分，厚 10 分，斜置于铺作层内",role:"斜置于铺作层内的杠杆构件——昂尾高举于内柱之上，昂头下探于檐口之下，以杠杆原理将檐荷转化为向内的压力，是中国建筑独有的结构智慧。",origin:'下昂是中国建筑最具独创性的构件发明之一。它以斜杆代替水平栱，用杠杆原理"以斜代平"，使铺作在更少的垂直空间内获得更大的出跳距离。琴面昂的曲面处理更兼顾了排水与美学。从唐代的批竹昂到宋代的琴面昂，下昂的演变见证了中国木构从雄大到精细的转变。',source:"《营造法式》卷四·大木作制度一（飞昂之制）",quote:'"飛昂，其名有二：一曰飛昂，二曰飛栱……造昂之制有二：一曰下昂，二曰上昂。"',hook:"以斜代平——中国建筑最精妙的力学翻译。"}},jc=["ludou","puaipai","huagong","nidao","guazi","man","xiaang","shuatou","linggong","jiaohidou","sandou","qixindou","zhutoufang","liaoyan"],aS={class:"enc-panel"},lS={class:"enc-head"},cS={class:"enc-body"},uS={class:"enc-list"},hS=["onClick"],fS={class:"enc-num"},dS={class:"enc-name"},pS={key:0,class:"enc-alias"},mS={key:0,class:"enc-detail"},_S={class:"ed-head"},gS={class:"ed-name"},vS={key:0,class:"ed-alias"},xS={class:"ed-dims"},yS={class:"ed-sec"},SS={class:"ed-text"},MS={class:"ed-sec"},bS={class:"ed-text"},ES={key:0,class:"ed-quote"},TS={class:"ed-quote-text"},wS={class:"ed-src"},AS={class:"ed-hook"},CS=yo({__name:"ComponentEncyclopedia",props:{open:{type:Boolean},initialK
